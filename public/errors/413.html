<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>ファイルが大きすぎます</title>
    <!--
        送信したデータがWebサーバーの上限(110MB)を超えたときに、Webサーバー(Nginx・Apache)が表示する案内ページ。
        アプリを通らずに表示するため、静的なHTMLにしている(CSPに合わせて、インラインのスクリプト・スタイルは使わない)
    -->
    <link rel="stylesheet" href="/vendor/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="/vendor/bootstrap-icons/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/vendor/noto-sans-jp/noto-sans-jp.css">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body class="guest-body">
    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6 text-center">
                <div class="display-4 fw-bold text-secondary mb-2">413</div>
                <h1 class="h4 fw-bold mb-3">ファイルが大きすぎます</h1>
                <p class="text-muted mb-4">
                    送信したファイルの合計が大きすぎるため、受け付けられませんでした。<br>
                    添付できるのは1ファイル10MB・1回に10ファイルまでです。<br>
                    前の画面に戻り、ファイルを分けて送信してください。
                </p>
                <a href="/" class="btn btn-primary"><i class="bi bi-house-door me-1"></i>ホームへ</a>
            </div>
        </div>
    </main>
</body>
</html>
