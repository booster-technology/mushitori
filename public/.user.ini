; ムシトリ用 PHP 設定
;
; PHP が php-fpm(FastCGI)で動いているサーバーでは、このファイルの設定が自動で使われる
; (反映まで最大5分かかる。使えないサーバーでは無視されるだけで害はない)。
; サーバー全体で設定する場合は deploy/php/99-mushitori.ini を使う(値はそちらと揃えること)。
; レンタルサーバーで反映されない場合は、コントロールパネルの「php.ini 設定」などで同じ値にする

; 画像などの添付ファイルの投稿(1ファイル10MB・1回に最大10ファイル + 本文)
upload_max_filesize = 12M
post_max_size = 110M
max_file_uploads = 20

; 画像の縮小・サムネイル作成に時間がかかることがあるため
max_execution_time = 120
max_input_time = 120
memory_limit = 256M
