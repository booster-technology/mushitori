# ムシトリ用 Nginx 設定例(HTTPのみ・社内LANなどSSLを使わない場合)
# インターネットに公開する場合は HTTPS 版(mushitori.conf)を使うこと
# 配置例: /etc/nginx/conf.d/mushitori.conf

server {
    listen 80;
    listen [::]:80;
    server_name issues.example.com;

    root /var/www/mushitori/public;
    index index.php;
    charset utf-8;

    # ===== 画像などの添付ファイルの投稿 =====
    # 1回の投稿の上限: 1ファイル10MB × 最大10ファイル + 本文 = 110MB。php.ini の post_max_size と揃える
    client_max_body_size 110M;
    # 送信が途切れたときに待つ時間(回線の遅いスマホからの送信も途中で切らないように。送信全体にかかる時間の上限ではない)
    client_body_timeout 120s;
    # 上限を超えた投稿には、Nginxの英語のエラー画面ではなく日本語の案内(public/errors/413.html)を表示する
    error_page 413 /errors/413.html;

    # X-Frame-Options・X-Content-Type-Options・Referrer-Policy はアプリが付ける(app/Http/Middleware/SecurityHeaders.php)

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~* \.(?:css|js|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
        try_files $uri /index.php?$query_string;
        expires 7d;
        access_log off;
    }

    # エラー時の案内ページ(error_page から表示するだけで、URLを直接開いても表示しない)
    location ^~ /errors/ {
        internal;
    }

    error_page 404 /index.php;

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php-fpm/www.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        # 画像の縮小・サムネイル作成に時間がかかることがあるため、PHPの応答を120秒まで待つ(php.ini の max_execution_time と揃える)
        fastcgi_read_timeout 120s;
    }

    # index.php 以外のPHPファイルや隠しファイル(.env等)には絶対にアクセスさせない
    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
