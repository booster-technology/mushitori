# ムシトリ用 Apache 設定例(本番・HTTPS)
#
# 配置例: /etc/httpd/conf.d/mushitori.conf(Amazon Linux / RHEL系)
#         /etc/apache2/sites-available/mushitori.conf(Debian/Ubuntu系。sudo a2ensite mushitori で有効化)
# 必要なモジュール: ssl・proxy・proxy_fcgi・rewrite・headers・expires
#   Debian/Ubuntu: sudo a2enmod ssl proxy_fcgi rewrite headers expires
#   (RHEL系は httpd と mod_ssl のパッケージを入れれば有効になっている)
#
# - ドキュメントルートは Laravel の public ディレクトリ(一式は公開ディレクトリの外に置く。README の「設置場所」を参照)
# - PHP は PHP-FPM で動かす(ソケットのパスは環境に合わせて変更。Debian/Ubuntu は unix:/run/php/php8.3-fpm.sock)
# - .htaccess は使わない(AllowOverride None)。必要な設定はすべてここに書いている
# - X-Frame-Options・CSP などのセキュリティ関連のヘッダーはアプリが付ける(app/Http/Middleware/SecurityHeaders.php)
# - サーバー全体の設定(httpd.conf / security.conf)で ServerTokens Prod・ServerSignature Off にしておくとよい

<VirtualHost *:80>
    ServerName issues.example.com

    # Let's Encrypt の認証用のURL以外は HTTPS へ転送する
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://issues.example.com%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName issues.example.com
    DocumentRoot /var/www/mushitori/public
    DirectoryIndex index.php

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/issues.example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/issues.example.com/privkey.pem

    # ===== 画像などの添付ファイルの投稿 =====
    # 1回の投稿の上限: 1ファイル10MB × 最大10ファイル + 本文 = 110MB(115343360バイト)。php.ini の post_max_size と揃える
    LimitRequestBody 115343360
    # 画像の縮小・サムネイル作成に時間がかかることがあるため、PHPの応答を120秒まで待つ(php.ini の max_execution_time と揃える)
    Timeout 120
    ProxyTimeout 120
    # 上限を超えた投稿には、Apacheの英語のエラー画面ではなく日本語の案内(public/errors/413.html)を表示する
    ErrorDocument 413 /errors/413.html
    # ※回線の遅いスマホからの送信は、mod_reqtimeout の標準設定(1秒あたり500バイト以上届いていれば待ち続ける)のままで問題ない

    <Directory /var/www/mushitori/public>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted

        # ファイルが無いURLは、すべて Laravel(index.php)で処理する
        FallbackResource /index.php

        # PHP-FPM に渡すのは index.php だけ
        <Files "index.php">
            SetHandler "proxy:unix:/run/php-fpm/www.sock|fcgi://localhost"
        </Files>
    </Directory>

    # index.php 以外のPHPファイルや隠しファイル(.env等)には絶対にアクセスさせない
    <FilesMatch "^(?!index\.php$).+\.(php|phar|phtml)$">
        Require all denied
    </FilesMatch>
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>
    <DirectoryMatch "/\.(?!well-known)">
        Require all denied
    </DirectoryMatch>

    # 常に HTTPS で開かせる(HSTS)
    Header always set Strict-Transport-Security "max-age=31536000"

    # CSS・JS・画像は更新時にURL(?v=)が変わるので、長めにキャッシュしてよい
    <LocationMatch "^/(vendor|css|js|images)/">
        ExpiresActive On
        ExpiresDefault "access plus 7 days"
    </LocationMatch>
</VirtualHost>
