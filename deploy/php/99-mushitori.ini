; ムシトリ用 PHP 設定例
; 配置例: /etc/php.d/99-mushitori.ini (Amazon Linux / RHEL系) または /etc/php/8.3/fpm/conf.d/99-mushitori.ini (Debian/Ubuntu系)
; 設定後は php-fpm を再起動する
;
; Webサーバーの設定(deploy/nginx・deploy/apache)と値を揃えること:
;   投稿の上限 … post_max_size = Nginx の client_max_body_size = Apache の LimitRequestBody(110MB)
;   処理時間   … max_execution_time = Nginx の fastcgi_read_timeout = Apache の ProxyTimeout(120秒)

; ===== 画像などの添付ファイルの投稿 =====
; 1ファイル10MB・1回に最大10ファイル(アプリ側の上限)+ 本文が収まる大きさにする
upload_max_filesize = 12M
post_max_size = 110M
max_file_uploads = 20

; 画像の縮小・サムネイル作成に時間がかかることがあるため、1回の処理を120秒まで許す
; (php-fpm のプール設定 request_terminate_timeout を設定している場合は、それも120秒以上にする)
max_execution_time = 120
; 送信されたデータの受け取りにかけてよい時間(回線の遅いスマホからの送信も途中で切らないように)
max_input_time = 120

; 画像の縮小・サムネイル作成用(1回の処理で使うメモリの上限は .env の IMAGE_MEMORY_LIMIT で別に制限している)
memory_limit = 256M

; 日本時間
date.timezone = Asia/Tokyo

; PHPのバージョンを応答ヘッダーで知らせない
expose_php = Off
